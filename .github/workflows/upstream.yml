name: Check upstream skills

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Detect newer upstream skill revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_upstream.py
